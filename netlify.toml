# Site statique : aucune compilation, les pages sont à la racine.
[build]
  publish = "."

# Ancienne adresse Netlify -> domaine principal
[[redirects]]
  from = "https://maisonbrb.netlify.app/*"
  to = "https://maisonbrb.fr/:splat"
  status = 301
  force = true

# Les fichiers de travail ne doivent pas être accessibles en ligne.
[[redirects]]
  from = "/outils/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/identite/*"
  to = "/404.html"
  status = 404
  force = true

# Ancienne page renommée (BRB Bâtiment -> BRB Multiservices)
[[redirects]]
  from = "/brb-batiment.html"
  to = "/brb-multiservices.html"
  status = 301
  force = true

# brbmultiservices.fr (alias de domaine de ce site Netlify) -> page BRB Multiservices
[[redirects]]
  from = "https://brbmultiservices.fr/*"
  to = "https://maisonbrb.fr/brb-multiservices.html"
  status = 301
  force = true

[[redirects]]
  from = "https://www.brbmultiservices.fr/*"
  to = "https://maisonbrb.fr/brb-multiservices.html"
  status = 301
  force = true

[[redirects]]
  from = "http://brbmultiservices.fr/*"
  to = "https://maisonbrb.fr/brb-multiservices.html"
  status = 301
  force = true

[[redirects]]
  from = "http://www.brbmultiservices.fr/*"
  to = "https://maisonbrb.fr/brb-multiservices.html"
  status = 301
  force = true
